name: Build and Push to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for Bot
      id: meta-bot
      uses: docker/metadata-action@v4
      with:
        images: ghcr.io/${{ github.repository_owner }}/extremegiveawaysdc-bot

    
    - name: Build and push Bot image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.bot
        push: ${{ github.event_name != 'pull_request' }}
        platforms: linux/amd64,linux/arm64   # 👈 DAS ist der wichtige Teil
        tags: ${{ steps.meta-bot.outputs.tags }}
        labels: ${{ steps.meta-bot.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-and-push-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    
    - name: Log in to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for Web
      id: meta-web
      uses: docker/metadata-action@v4
      with:
        images: ghcr.io/${{ github.repository_owner }}/extremegiveawaysdc-web
    
    - name: Build and push Web image
      uses: docker/build-push-action@v4
      with:
        context: ./web_interface
        file: ./web_interface/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-web.outputs.tags }}
        labels: ${{ steps.meta-web.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
