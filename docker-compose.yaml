version: '3.8'

services:
  discord-bot:
    image: ghcr.io/extremegiveawaysdc/extremegiveawaysdc-bot:latest
    container_name: extremegiveaways-bot
    restart: unless-stopped
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DATA_PATH=/data
      - LOG_LEVEL=INFO
      - TZ=Europe/Berlin
    volumes:
      - ./data:/data
    networks:
      - giveaway-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web-interface:
    image: ghcr.io/extremegiveawaysdc/extremegiveawaysdc-web:latest
    container_name: extremegiveaways-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Flask Configuration
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      
      # Discord OAuth
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      
      # Database
      - DATABASE_URL=sqlite:///data/web_interface.db
      
      # Paths
      - DATA_PATH=/data
      - GIVEAWAY_FILE=/data/giveaways.json
      - SERVER_SETTINGS_FILE=/data/server_settings.json
      - STATISTICS_FILE=/data/statistics.json
      - ENDED_GIVEAWAYS_FILE=/data/ended_giveaways.json
      
      # Security
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_HTTPONLY=true
      - SESSION_COOKIE_SAMESITE=Lax
      
      # Server
      - HOST=0.0.0.0
      - PORT=8080
      - WORKERS=4
      - THREADS=2
    volumes:
      - ./data:/data
    depends_on:
      - discord-bot
    networks:
      - giveaway-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  giveaway-network:
    driver: bridge